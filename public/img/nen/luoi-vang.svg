<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice">
  <!-- Lưới trám vàng mảnh phủ trên nền đỏ (SOBA tự vẽ) – nền trong suốt -->
  <defs>
    <pattern id="l" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0h30M0 0v30" stroke="#f3d38c" stroke-opacity=".13" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#f3d38c" fill-opacity=".22"/>
    </pattern>
    <radialGradient id="v" cx="50%" cy="45%" r="75%">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </radialGradient>
  </defs>
  <rect width="420" height="900" fill="url(#l)"/>
  <rect width="420" height="900" fill="url(#v)"/>
</svg>
